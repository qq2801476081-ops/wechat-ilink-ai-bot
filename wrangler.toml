name = "wechat-ilink-ai-bot"
main = "src/index.ts"
compatibility_date = "2026-08-06"

[vars]
ILINK_BASE_URL = "https://ilinkai.weixin.qq.com"

[triggers]
crons = ["* * * * *"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "wechat-bot-db"
database_id = "c219f60d-572f-47bb-96b7-52be3174c7fb"

# 部署前执行：wrangler secret put BOT_STATE_ENC_KEY
# 可选：wrangler secret put DEEPSEEK_API_KEY
# 可选：wrangler secret put OPENAI_API_KEY
